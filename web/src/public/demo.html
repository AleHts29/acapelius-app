<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/app/icon-192.png" type="image/png">
<link rel="preload" href="/site/fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site/afiche.css">
<title>Demo — Acapelius</title>
<meta name="description" content="Entrá a la demo de Acapelius sin registrarte.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F1EA">
</head>
<body>
<div class="auth">
  <div class="auth__l">
    <a class="auth__lg" href="/">ACAPELIUS</a>
    <h1>Entrando<br>a la demo</h1>
    <p class="sb" id="estado">Una temporada de mentira cargada, con rol de dirección. Tocá todo: los datos se reinician cada noche.</p>
    <p class="err" role="alert" aria-live="polite"></p>
    <p class="go"><button class="btn btn--ink btn--block" id="reintentar" type="button" hidden>Probar de nuevo</button></p>
    <p class="alt">¿Ya tenés cuenta? <a href="/entrar">Entrar</a> · <a href="/crear-cuenta">Crear cuenta</a></p>
  </div>
  <aside class="auth__r" aria-label="Acapelius">
    <p class="big">Entrá<br>y tocá<br><em>todo.</em></p>
    <p class="nt">Datos de mentira · se reinicia cada noche · no se manda ningún mail</p>
  </aside>
</div>
<script>
(function () {
  var err = document.querySelector('.err'), btn = document.getElementById('reintentar')
  function entrar() {
    err.textContent = ''; btn.hidden = true
    fetch('/api/demo/session', { method: 'POST', credentials: 'same-origin' })
      .then(function (r) {
        if (r.ok) { window.location.replace('/app/'); return }
        err.textContent = r.status === 429 ? 'Demasiados intentos seguidos. Esperá un rato.' : 'La demo no está disponible en este momento.'
        btn.hidden = false
      })
      .catch(function () { err.textContent = 'No hay conexión. Probá de nuevo.'; btn.hidden = false })
  }
  btn.addEventListener('click', entrar)
  entrar()
})()
</script>
</body>
</html>
